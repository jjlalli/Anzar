<svg viewBox="0 0 960 1180" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="960" height="1180" fill="#EEF1F4"/>

  <!-- header -->
  <text x="42" y="50" font-size="26" font-weight="800" fill="#0B2545">Anzar</text>
  <text x="42" y="72" font-size="13" fill="#6b7280">Composants — vue éclatée</text>

  <!-- center axis -->
  <line x1="480" y1="110" x2="480" y2="1120" stroke="#C7CDD4" stroke-width="1.4" stroke-dasharray="3 7"/>

  <!-- ===== CASING (lid) ===== -->
  <g>
    <rect x="352" y="120" width="256" height="118" rx="40" fill="#F4F6F8" stroke="#D6DBE1"/>
    <rect x="352" y="222" width="256" height="16" rx="8" fill="#E5E9ED" stroke="#D6DBE1"/>
    <line x1="368" y1="210" x2="592" y2="210" stroke="#E1E5EA" stroke-width="1.5"/>
    <ellipse cx="430" cy="160" rx="34" ry="16" fill="#FBFCFD" opacity="0.7"/>
  </g>

  <!-- ===== PCB with ESP32 ===== -->
  <g>
    <rect x="330" y="335" width="300" height="100" rx="6" fill="#2F7D46" stroke="#256B3C"/>
    <rect x="330" y="427" width="300" height="8" rx="4" fill="#1F5C33"/>
    <!-- mounting holes -->
    <circle cx="347" cy="352" r="5" fill="#EEF1F4" stroke="#1F5C33"/>
    <circle cx="613" cy="352" r="5" fill="#EEF1F4" stroke="#1F5C33"/>
    <circle cx="347" cy="418" r="5" fill="#EEF1F4" stroke="#1F5C33"/>
    <circle cx="613" cy="418" r="5" fill="#EEF1F4" stroke="#1F5C33"/>
    <!-- micro-USB -->
    <rect x="330" y="373" width="24" height="24" rx="2" fill="#AEB4BC" stroke="#8B9199"/>
    <!-- ESP32 module -->
    <rect x="470" y="349" width="120" height="56" rx="3" fill="#16171B"/>
    <rect x="478" y="355" width="104" height="34" rx="2" fill="#B9BEC6"/>
    <line x1="484" y1="362" x2="576" y2="362" stroke="#9298A0" stroke-width="1"/>
    <line x1="484" y1="368" x2="576" y2="368" stroke="#9298A0" stroke-width="1"/>
    <text x="530" y="401" font-size="10" fill="#D3D7DC" text-anchor="middle" letter-spacing="1">ESP32</text>
    <!-- a few pads -->
    <circle cx="392" cy="356" r="3" fill="#C9A24B"/>
    <circle cx="404" cy="356" r="3" fill="#C9A24B"/>
    <circle cx="392" cy="366" r="3" fill="#C9A24B"/>
    <circle cx="404" cy="366" r="3" fill="#C9A24B"/>
    <!-- sensor cable -->
    <path d="M588 432 C 648 470, 648 590, 520 626" fill="none" stroke="#111214" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- ===== COIN BATTERY ===== -->
  <g>
    <rect x="410" y="496" width="140" height="22" fill="#CBD0D6"/>
    <ellipse cx="480" cy="518" rx="70" ry="17" fill="#BEC3CA" stroke="#AAB0B8"/>
    <ellipse cx="480" cy="496" rx="70" ry="17" fill="#D9DDE2" stroke="#B7BDC5"/>
    <text x="480" y="501" font-size="15" font-weight="700" fill="#5B6169" text-anchor="middle" letter-spacing="1">CR2032</text>
  </g>

  <!-- ===== PIEZO SENSOR ===== -->
  <g>
    <rect x="424" y="624" width="112" height="12" fill="#141519"/>
    <ellipse cx="480" cy="636" rx="56" ry="14" fill="#0E0F12"/>
    <ellipse cx="480" cy="624" rx="56" ry="14" fill="#1B1C20"/>
    <ellipse cx="480" cy="623" rx="20" ry="6" fill="#C29B4E"/>
  </g>

  <!-- ===== PIPE + CLAMP ===== -->
  <g>
    <!-- copper pipe -->
    <rect x="252" y="846" width="456" height="64" fill="#C07C46"/>
    <rect x="252" y="846" width="456" height="15" fill="#D69A63"/>
    <rect x="252" y="897" width="456" height="13" fill="#A5642F"/>
    <ellipse cx="708" cy="878" rx="15" ry="32" fill="#B07040"/>
    <ellipse cx="252" cy="878" rx="15" ry="32" fill="#7D4A22"/>
    <ellipse cx="252" cy="878" rx="8" ry="21" fill="#5C3618"/>
    <!-- navy clamp -->
    <ellipse cx="480" cy="840" rx="30" ry="11" fill="#2E3C5A"/>
    <rect x="450" y="838" width="60" height="80" rx="15" fill="#26334E"/>
    <rect x="504" y="860" width="46" height="36" rx="9" fill="#2B3A58"/>
    <circle cx="533" cy="878" r="7" fill="#EEF1F4"/>
  </g>

  <!-- ===== LABELS (accurate, hand-set) ===== -->
  <g stroke="#9AA2AC" stroke-width="1.3">
    <line x1="250" y1="181" x2="350" y2="181"/>
    <line x1="250" y1="392" x2="468" y2="380"/>
    <line x1="250" y1="505" x2="410" y2="503"/>
    <line x1="250" y1="632" x2="424" y2="628"/>
    <line x1="250" y1="880" x2="450" y2="878"/>
  </g>
  <g fill="#0B2545">
    <circle cx="250" cy="181" r="4"/>
    <circle cx="250" cy="392" r="4"/>
    <circle cx="250" cy="505" r="4"/>
    <circle cx="250" cy="632" r="4"/>
    <circle cx="250" cy="880" r="4"/>
  </g>

  <g text-anchor="end">
    <text x="236" y="186" font-size="17" font-weight="700" fill="#0B2545">Boîtier (couvercle)</text>

    <text x="236" y="386" font-size="17" font-weight="700" fill="#0B2545">Carte ESP32</text>
    <text x="236" y="406" font-size="12.5" fill="#6b7280">microcontrôleur + WiFi</text>

    <text x="236" y="510" font-size="17" font-weight="700" fill="#0B2545">Pile CR2032</text>

    <text x="236" y="628" font-size="17" font-weight="700" fill="#0B2545">Capteur acoustique</text>
    <text x="236" y="648" font-size="12.5" fill="#6b7280">micro de contact (piézo)</text>

    <text x="236" y="874" font-size="17" font-weight="700" fill="#0B2545">Collier de fixation</text>
    <text x="236" y="894" font-size="12.5" fill="#6b7280">+ conduite d'eau</text>
  </g>
</svg>
