<svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="960" height="640" fill="#EEF1F4"/>
  <text x="42" y="50" font-size="26" font-weight="800" fill="#0B2545">Anzar</text>
  <text x="42" y="72" font-size="13" fill="#6b7280">Mounted on a water pipe</text>

  <!-- pipe -->
  <rect x="150" y="400" width="680" height="68" fill="#C07C46"/>
  <rect x="150" y="400" width="680" height="16" fill="#D69A63"/>
  <rect x="150" y="453" width="680" height="15" fill="#A5642F"/>
  <ellipse cx="830" cy="434" rx="15" ry="34" fill="#B07040"/>
  <ellipse cx="150" cy="434" rx="15" ry="34" fill="#7D4A22"/>
  <ellipse cx="150" cy="434" rx="8" ry="21" fill="#5C3618"/>

  <!-- unit -->
  <rect x="330" y="272" width="300" height="124" rx="30" fill="#F4F6F8" stroke="#D6DBE1"/>
  <rect x="330" y="382" width="300" height="16" rx="8" fill="#E5E9ED" stroke="#D6DBE1"/>
  <ellipse cx="410" cy="306" rx="40" ry="16" fill="#FBFCFD" opacity="0.8"/>
  <text x="480" y="352" font-size="22" font-weight="700" fill="#0B2545" text-anchor="middle" font-family="Georgia, serif">Anzar</text>

  <!-- clamps -->
  <rect x="368" y="262" width="26" height="218" rx="11" fill="#26334E" opacity="0.92"/>
  <rect x="566" y="262" width="26" height="218" rx="11" fill="#26334E" opacity="0.92"/>

  <!-- labels -->
  <g stroke="#9AA2AC" stroke-width="1.3">
    <line x1="250" y1="320" x2="330" y2="320"/>
    <line x1="250" y1="250" x2="381" y2="268"/>
    <line x1="250" y1="510" x2="300" y2="466"/>
  </g>
  <g fill="#0B2545">
    <circle cx="250" cy="320" r="4"/>
    <circle cx="250" cy="250" r="4"/>
    <circle cx="250" cy="510" r="4"/>
  </g>

  <g text-anchor="end">
    <text x="236" y="318" font-size="17" font-weight="700" fill="#0B2545">Anzar unit</text>
    <text x="236" y="337" font-size="12.5" fill="#6b7280">Nucleo + sensor shield inside,</text>
    <text x="236" y="353" font-size="12.5" fill="#6b7280">battery powered</text>
    <text x="236" y="255" font-size="17" font-weight="700" fill="#0B2545">Clamps or straps</text>
    <text x="236" y="508" font-size="17" font-weight="700" fill="#0B2545">Water pipe</text>
  </g>
</svg>
