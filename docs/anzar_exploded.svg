<svg viewBox="0 0 960 1000" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="960" height="1000" fill="#EEF1F4"/>
  <text x="42" y="50" font-size="26" font-weight="800" fill="#0B2545">Anzar</text>
  <text x="42" y="72" font-size="13" fill="#6b7280">Exploded view</text>

  <line x1="540" y1="96" x2="540" y2="960" stroke="#C7CDD4" stroke-width="1.4" stroke-dasharray="3 7"/>

  <!-- enclosure lid -->
  <rect x="400" y="110" width="280" height="100" rx="30" fill="#F4F6F8" stroke="#D6DBE1"/>
  <rect x="400" y="196" width="280" height="14" rx="7" fill="#E5E9ED" stroke="#D6DBE1"/>
  <ellipse cx="470" cy="140" rx="36" ry="14" fill="#FBFCFD" opacity="0.8"/>

  <!-- MEMS sensor shield -->
  <rect x="395" y="290" width="290" height="100" rx="6" fill="#2C5F7C" stroke="#234E66"/>
  <rect x="395" y="382" width="290" height="8" rx="4" fill="#1E4458"/>
  <rect x="415" y="298" width="118" height="8" fill="#1A1A1A"/>
  <rect x="560" y="298" width="105" height="8" fill="#1A1A1A"/>
  <rect x="430" y="370" width="95" height="8" fill="#1A1A1A"/>
  <rect x="560" y="370" width="105" height="8" fill="#1A1A1A"/>
  <rect x="525" y="328" width="26" height="26" rx="2" fill="#121418"/>
  <rect x="582" y="330" width="16" height="16" rx="2" fill="#3E4650"/>
  <rect x="470" y="332" width="14" height="14" rx="2" fill="#3E4650"/>

  <!-- STM32 Nucleo board -->
  <rect x="380" y="470" width="320" height="150" rx="8" fill="#F7F7F2" stroke="#CFCFC4"/>
  <rect x="380" y="470" width="320" height="36" rx="8" fill="#ECECE4"/>
  <rect x="380" y="612" width="320" height="8" rx="4" fill="#DADACE"/>
  <rect x="525" y="460" width="30" height="16" rx="3" fill="#AEB4BC" stroke="#8B9199"/>
  <rect x="440" y="480" width="20" height="16" rx="2" fill="#3E4650"/>
  <rect x="410" y="524" width="110" height="9" fill="#1A1A1A"/>
  <rect x="560" y="524" width="120" height="9" fill="#1A1A1A"/>
  <rect x="430" y="590" width="95" height="9" fill="#1A1A1A"/>
  <rect x="560" y="590" width="110" height="9" fill="#1A1A1A"/>
  <rect x="515" y="540" width="50" height="40" rx="3" fill="#16171B"/>
  <text x="540" y="564" font-size="10" fill="#E6E9ED" text-anchor="middle" letter-spacing="0.5">STM32</text>
  <rect x="622" y="548" width="10" height="6" rx="1" fill="#2E9E5B"/>

  <!-- battery pack on VIN -->
  <path d="M700 590 C 730 590, 735 560, 760 560" fill="none" stroke="#B3261E" stroke-width="3" stroke-linecap="round"/>
  <path d="M700 598 C 732 598, 738 572, 760 572" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round"/>
  <rect x="760" y="530" width="120" height="70" rx="8" fill="#3E4650"/>
  <rect x="770" y="542" width="30" height="46" rx="5" fill="#5B6570"/>
  <rect x="805" y="542" width="30" height="46" rx="5" fill="#5B6570"/>
  <rect x="840" y="542" width="30" height="46" rx="5" fill="#5B6570"/>

  <!-- enclosure base -->
  <rect x="400" y="690" width="280" height="60" rx="14" fill="#E9ECEF" stroke="#D6DBE1"/>
  <rect x="414" y="697" width="252" height="38" rx="8" fill="#F4F6F8"/>

  <!-- pipe and clamps -->
  <rect x="300" y="840" width="480" height="62" fill="#C07C46"/>
  <rect x="300" y="840" width="480" height="15" fill="#D69A63"/>
  <rect x="300" y="889" width="480" height="13" fill="#A5642F"/>
  <ellipse cx="780" cy="871" rx="14" ry="31" fill="#B07040"/>
  <ellipse cx="300" cy="871" rx="14" ry="31" fill="#7D4A22"/>
  <ellipse cx="300" cy="871" rx="7" ry="20" fill="#5C3618"/>
  <rect x="455" y="828" width="30" height="86" rx="12" fill="#26334E"/>
  <rect x="596" y="828" width="30" height="86" rx="12" fill="#26334E"/>

  <!-- labels -->
  <g stroke="#9AA2AC" stroke-width="1.3">
    <line x1="280" y1="160" x2="400" y2="160"/>
    <line x1="280" y1="338" x2="525" y2="341"/>
    <line x1="280" y1="552" x2="515" y2="558"/>
    <line x1="280" y1="720" x2="400" y2="720"/>
    <line x1="280" y1="871" x2="455" y2="871"/>
  </g>
  <g fill="#0B2545">
    <circle cx="280" cy="160" r="4"/>
    <circle cx="280" cy="338" r="4"/>
    <circle cx="280" cy="552" r="4"/>
    <circle cx="280" cy="720" r="4"/>
    <circle cx="280" cy="871" r="4"/>
  </g>

  <g text-anchor="end">
    <text x="266" y="165" font-size="17" font-weight="700" fill="#0B2545">Enclosure lid</text>

    <text x="266" y="336" font-size="17" font-weight="700" fill="#0B2545">X-NUCLEO-IKS01A3</text>
    <text x="266" y="355" font-size="12.5" fill="#6b7280">3-axis accelerometer, I2C</text>

    <text x="266" y="550" font-size="17" font-weight="700" fill="#0B2545">NUCLEO-F401RE</text>
    <text x="266" y="569" font-size="12.5" fill="#6b7280">runs the NanoEdge model</text>

    <text x="266" y="718" font-size="17" font-weight="700" fill="#0B2545">Enclosure base</text>
    <text x="266" y="737" font-size="12.5" fill="#6b7280">held tight against the pipe</text>

    <text x="266" y="869" font-size="17" font-weight="700" fill="#0B2545">Clamps or straps</text>
    <text x="266" y="888" font-size="12.5" fill="#6b7280">on the water pipe</text>
  </g>
  <text x="760" y="626" font-size="17" font-weight="700" fill="#0B2545">Battery pack</text>
  <text x="760" y="645" font-size="12.5" fill="#6b7280">7-12 V, wired to VIN</text>
</svg>
