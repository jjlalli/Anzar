<svg viewBox="0 0 960 700" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="960" height="700" fill="#EEF1F4"/>
  <text x="42" y="50" font-size="26" font-weight="800" fill="#0B2545">Anzar</text>
  <text x="42" y="72" font-size="13" fill="#6b7280">Vue assemblée — installé sur la conduite</text>

  <!-- pipe -->
  <rect x="150" y="396" width="660" height="68" fill="#C07C46"/>
  <rect x="150" y="396" width="660" height="15" fill="#D69A63"/>
  <rect x="150" y="449" width="660" height="15" fill="#A5642F"/>
  <ellipse cx="810" cy="430" rx="15" ry="34" fill="#B07040"/>
  <ellipse cx="150" cy="430" rx="15" ry="34" fill="#7D4A22"/>
  <ellipse cx="150" cy="430" rx="8" ry="21" fill="#5C3618"/>

  <!-- signal arcs along pipe -->
  <g stroke="#1C48B5" stroke-width="2.4" fill="none" opacity="0.7" stroke-linecap="round">
    <path d="M556 420 q22 -14 44 0"/>
    <path d="M548 428 q30 -20 60 0"/>
  </g>

  <!-- clamp -->
  <ellipse cx="480" cy="392" rx="30" ry="10" fill="#2E3C5A"/>
  <rect x="450" y="390" width="60" height="80" rx="15" fill="#26334E"/>
  <rect x="504" y="414" width="44" height="34" rx="9" fill="#2B3A58"/>
  <circle cx="533" cy="431" r="7" fill="#EEF1F4"/>

  <!-- casing -->
  <rect x="356" y="256" width="248" height="118" rx="36" fill="#F4F6F8" stroke="#D6DBE1"/>
  <rect x="356" y="358" width="248" height="16" rx="8" fill="#E5E9ED" stroke="#D6DBE1"/>
  <line x1="372" y1="346" x2="588" y2="346" stroke="#E1E5EA" stroke-width="1.5"/>
  <ellipse cx="430" cy="296" rx="32" ry="15" fill="#FBFCFD" opacity="0.7"/>
  <!-- LED -->
  <circle cx="566" cy="292" r="7" fill="#1C48B5"/>
  <circle cx="566" cy="292" r="12" fill="none" stroke="#1C48B5" stroke-width="1.6" opacity="0.35"/>

  <!-- labels -->
  <g stroke="#9AA2AC" stroke-width="1.3">
    <line x1="712" y1="300" x2="604" y2="316"/>
    <line x1="712" y1="356" x2="573" y2="296"/>
    <line x1="248" y1="430" x2="450" y2="428"/>
    <line x1="248" y1="506" x2="250" y2="470"/>
    <line x1="480" y1="556" x2="480" y2="472"/>
  </g>
  <g fill="#0B2545">
    <circle cx="712" cy="300" r="4"/>
    <circle cx="712" cy="356" r="4"/>
    <circle cx="248" cy="430" r="4"/>
    <circle cx="248" cy="506" r="4"/>
    <circle cx="480" cy="556" r="4"/>
  </g>

  <text x="726" y="305" font-size="17" font-weight="700" fill="#0B2545">Boîtier Anzar</text>
  <text x="726" y="361" font-size="15" font-weight="700" fill="#0B2545">Témoin (LED)</text>

  <g text-anchor="end">
    <text x="236" y="435" font-size="17" font-weight="700" fill="#0B2545">Collier de fixation</text>
    <text x="236" y="511" font-size="17" font-weight="700" fill="#0B2545">Conduite d'eau</text>
  </g>

  <text x="480" y="578" font-size="16" font-weight="700" fill="#0B2545" text-anchor="middle">Capteur au contact du tuyau</text>
  <text x="480" y="598" font-size="12.5" fill="#6b7280" text-anchor="middle">il écoute le son à l'intérieur</text>
</svg>
